{% load secrets_tags %}
{% master_password_state as mp %}
<div class="modal fade" id="master_password_modal" tabindex="-1" role="dialog"
     data-has-master-password="{{ mp.has_master_password|yesno:'true,false' }}">
    <div class="modal-dialog modal-md" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="master_password_modal_title">
                    <span class="mdi mdi-form-textbox-password" aria-hidden="true"></span>
                    <span class="master-password-title">Master Password</span>
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <p class="small text-muted">Prove it's you with your private key{% if mp.has_master_password %} or your current master password{% endif %}.</p>

                <ul class="nav nav-tabs mb-3" role="tablist">
                    <li class="nav-item" role="presentation">
                        <button class="nav-link{% if not mp.has_master_password %} active{% endif %}" data-bs-toggle="tab"
                                data-bs-target="#mp_proof_key" data-proof="key" type="button" role="tab">
                            <i class="mdi mdi-key-variant"></i> Private Key
                        </button>
                    </li>
                    {% if mp.has_master_password %}
                        <li class="nav-item" role="presentation">
                            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#mp_proof_password"
                                    data-proof="password" type="button" role="tab">
                                <i class="mdi mdi-form-textbox-password"></i> Current Master Password
                            </button>
                        </li>
                    {% endif %}
                </ul>
                <div class="tab-content mb-3">
                    <div class="tab-pane fade{% if not mp.has_master_password %} show active{% endif %}" id="mp_proof_key" role="tabpanel">
                        <textarea class="form-control font-monospace" id="mp_private_key" style="height: 200px;"
                                  placeholder="-----BEGIN RSA PRIVATE KEY-----"></textarea>
                    </div>
                    {% if mp.has_master_password %}
                        <div class="tab-pane fade show active" id="mp_proof_password" role="tabpanel">
                            <input type="password" class="form-control" id="mp_current_password" autocomplete="off"
                                   placeholder="Current master password">
                        </div>
                    {% endif %}
                </div>

                <div class="master-password-new">
                    <label class="form-label" for="mp_new_password">New master password</label>
                    <input type="password" class="form-control mb-2" id="mp_new_password" autocomplete="new-password"
                           placeholder="At least {{ mp.min_length }} characters" minlength="{{ mp.min_length }}">
                    <label class="form-label" for="mp_confirm_password">Confirm new master password</label>
                    <input type="password" class="form-control" id="mp_confirm_password" autocomplete="new-password">
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" class="btn btn-primary" id="master_password_submit">Save</button>
            </div>
        </div>
    </div>
</div>
